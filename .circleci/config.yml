version: 2.1

orbs:
  node: circleci/node@7.2.1

jobs:
  verify:
    executor:
      name: node/default
      tag: '24.22.2'
    steps:
      - checkout
      - node/install-pnpm:
          version: '12.6.0'
      - run:
          name: Install the frozen dependency graph
          command: pnpm install --frozen-lockfile
      - run:
          name: Lint the package
          command: pnpm lint:ci
      - run:
          name: Verify the frontend SASS build and source map
          command: |
            node --input-type=module \<<'NODE'
            import assert from 'node:assert/strict';
            import fs from 'node:fs';
            import os from 'node:os';
            import path from 'node:path';
            import {spawnSync} from 'node:child_process';
            import {pathToFileURL} from 'node:url';

            const scratch = fs.mkdtempSync(path.join(os.tmpdir(), 'esbuild-contract-'));
            try {
              const entry = path.join(scratch, 'style.scss');
              const outdir = path.join(scratch, 'output');
              fs.writeFileSync(entry, '$color: #123456; .build-proof { color: $color; &:hover { color: red; } }');
              const entryUrl = pathToFileURL(path.resolve('index.js')).href;
              const code = `import {frontend} from ${JSON.stringify(entryUrl)}; frontend({entryPoints: [${JSON.stringify(entry)}], sassConfig: {type: 'css'}, config: {outdir: ${JSON.stringify(outdir)}, sourcemap: true}});`;
              const result = spawnSync(process.execPath, ['--input-type=module', '-e', code], {
                encoding: 'utf8',
                timeout: 60000,
              });
              assert.equal(result.status, 0, result.stderr);
              const css = fs.readFileSync(path.join(outdir, 'style.css'), 'utf8');
              const map = JSON.parse(fs.readFileSync(path.join(outdir, 'style.css.map'), 'utf8'));
              assert.match(css, /\.build-proof\{color:#123456\}/);
              assert.match(css, /\.build-proof:hover/);
              assert.equal(map.version, 3);
              assert.ok(map.sources.some(source => source.endsWith('style.scss')));
              assert.ok(map.sourcesContent.some(source => source.includes('$color')));
            } finally {
              fs.rmSync(scratch, {recursive: true, force: true});
            }
            NODE

workflows:
  tagged-build:
    jobs:
      - verify
